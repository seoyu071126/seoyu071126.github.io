<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idol Archive</title>
  <style>
    :root {
      --bg: #0f0f11;
      --card-bg: #18181c;
      --text: #f0f0f5;
      --accent: #a29bfe;
      --muted: #8e8e93;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 { font-weight: 300; letter-spacing: 2px; margin-bottom: 8px; }
    p.subtitle { color: var(--muted); font-size: 0.9rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
      transition: transform 0.2s ease;
    }

    .card:hover { transform: translateY(-4px); }

    .card-img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
    }

    .card-body { padding: 16px; }
    .tag { color: var(--accent); font-size: 0.75rem; text-transform: uppercase; }
    .title { font-size: 1rem; margin: 6px 0; }
    .date { color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>

  <header>
    <h1>MEDIA ARCHIVE</h1>
    <p class="subtitle">PHOTO & VIDEO COLLECTION</p>
  </header>

  <div class="card">
  <a href="https://www.youtube.com/watch?v=1S2X15eTtJ0" target="_blank">
    <img class="card-img" src="https://img.youtube.com/vi/1S2X15eTtJ0/maxresdefault.jpg" alt="[플리캠 4K] USPEER SEOYU ‘WICKED GAME’">
  </a>
  <div class="card-body">
    <span class="tag">직캠</span>
    <h2 class="title">[플리캠 4K] USPEER SEOYU ‘WICKED GAME’ (유스피어 서유 직캠) | Simply K-Pop EP.13 260703</h2>
    <span class="date">2026.07.03</span>
  </div>
</div>
</body>
</html>

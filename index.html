<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>선우의</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
    /* General Page Setup */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
      color: #333;
    }

    /* Header & Titles */
    .header {
      text-align: center;
      padding: 40px 20px 20px;
    }

    .site-title {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 3.5rem;
      font-weight: 400;
      margin-bottom: 0px;
      margin-top: 0px;
    }

    .site-subtitle {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 2rem;
      color: #666;
      margin-top: 5px;
      margin-bottom: 20px;
    }

    /* Navigation Bar */
    .nav-menu {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-link {
      text-decoration: none;
      color: #555;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      border: 1px solid #ddd;
      background-color: #ffffff;
      transition: all 0.2s ease;
      display: inline-block;
    }

    .nav-link:hover, .nav-link.active {
      background-color: #222;
      color: #fff;
      border-color: #222;
    }

    /* Dropdown Menus */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      background-color: #ffffff;
      min-width: 130px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
      z-index: 10;
      padding: 6px 0;
      border: 1px solid #eee;
      margin-top: 4px;
    }

    .dropdown-content a {
      color: #333;
      padding: 8px 16px;
      text-decoration: none;
      display: block;
      font-size: 0.85rem;
      text-align: center;
      transition: background 0.2s ease;
    }

    .dropdown-content a:hover {
      background-color: #f5f5f5;
      color: #000;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }
  </style>
</head>
<body>

  <header class="header">
    <h1 class="site-title">선우의</h1>
    <p class="site-subtitle">서유토낑 🐰</p>

    <!-- Navigation Menu with Dropdowns -->
    <nav class="nav-menu">
      <a href="#" class="nav-link">ABOUT</a>

      <!-- PHOTOS Dropdown -->
      <div class="dropdown">
        <a href="#" class="nav-link">PHOTOS ▾</a>
        <div class="dropdown-content">
          <a href="#">X</a>
          <a href="#">Instagram</a>
          <a href="#">Daum Cafe</a>
          <a href="#">Pluschat</a>
        </div>
      </div>

      <!-- VIDEOS Dropdown -->
      <div class="dropdown">
        <a href="#" class="nav-link">VIDEOS ▾</a>
        <div class="dropdown-content">
          <a href="fancam.html">직캠</a>
          <a href="#">공식</a>
        </div>
      </div>
    </nav>
  </header>

  <!-- Home page content cleared for now -->
</div>
</body>
</html>

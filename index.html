  <style>
    /* General Page Setup */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header & Titles */
    .header {
      text-align: center;
      padding: 40px 20px 20px;
    }

    .site-title {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 3.5rem;
      font-weight: 400;
      margin-bottom: 0px;
      margin-top: 0px;
    }

    .site-subtitle {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 2rem;
      color: #666;
      margin-top: 5px;
      margin-bottom: 20px;
    }

    /* Navigation Bar */
    .nav-menu {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-link {
      text-decoration: none;
      color: #555;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      border: 1px solid #ddd;
      background-color: #ffffff;
      transition: all 0.2s ease;
      display: inline-block;
    }

    .nav-link:hover, .nav-link.active {
      background-color: #222;
      color: #fff;
      border-color: #222;
    }

    /* Dropdown Menus */
    .dropdown {
      position: relative;
      display: inline-block;
      padding-bottom: 12px;
      margin-bottom: -12px;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      background-color: #ffffff;
      min-width: 180px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
      z-index: 10;
      padding: 6px 0;
      border: 1px solid #eee;
    }

    .dropdown-content a {
      color: #333;
      padding: 8px 16px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      text-align: left;
      white-space: nowrap;
      transition: background 0.2s ease;
    }

    .dropdown-content a i {
      font-size: 1rem;
      width: 16px;
      text-align: center;
    }

    .dropdown-content a:hover {
      background-color: #f5f5f5;
      color: #000;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    /* Content Container */
    .content-container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
      flex: 1;
    }

    /* Social Links List Styling */
    .social-links {
      display: inline-flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
      text-align: left;
    }

    .social-link-item {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #333;
      font-size: 1rem;
      font-weight: 500;
      transition: opacity 0.2s ease;
    }

    .social-link-item:hover {
      opacity: 0.7;
    }

    .social-link-item i {
      font-size: 1.2rem;
      width: 24px;
      text-align: center;
    }

    /* Footer / Copyright */
    .footer {
      text-align: center;
      padding: 20px;
      font-size: 0.8rem;
      color: #888;
      border-top: 1px solid #eee;
      background-color: #fff;
    }
  </style>
